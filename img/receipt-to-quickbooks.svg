<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">From receipt photo to QuickBooks Online Canada</title><desc id="d">Four steps: photograph the receipt, AI reads vendor, date, total and GST/HST, you review and approve, the expense syncs to QuickBooks Online Canada.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#007a3d"/></marker></defs>
<rect width="960" height="260" fill="#ffffff"/>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
<g><rect x="20" y="50" width="200" height="140" rx="12" fill="#f0ede8" stroke="#00A854" stroke-width="2"/><text x="120" y="82" font-size="14" fill="#007a3d" font-weight="700">STEP 1</text><text x="120" y="116" font-size="18" fill="#1a1a1a" font-weight="700">Photograph</text><text x="120" y="142" font-size="15" fill="#555">Snap the receipt</text><text x="120" y="164" font-size="15" fill="#555">on your phone</text></g>
<g><rect x="260" y="50" width="200" height="140" rx="12" fill="#f0ede8" stroke="#00A854" stroke-width="2"/><text x="360" y="82" font-size="14" fill="#007a3d" font-weight="700">STEP 2</text><text x="360" y="116" font-size="18" fill="#1a1a1a" font-weight="700">AI reads it</text><text x="360" y="142" font-size="15" fill="#555">Vendor, date, total,</text><text x="360" y="164" font-size="15" fill="#555">GST/HST</text></g>
<g><rect x="500" y="50" width="200" height="140" rx="12" fill="#f0ede8" stroke="#00A854" stroke-width="2"/><text x="600" y="82" font-size="14" fill="#007a3d" font-weight="700">STEP 3</text><text x="600" y="116" font-size="18" fill="#1a1a1a" font-weight="700">You approve</text><text x="600" y="142" font-size="15" fill="#555">Fix anything the AI</text><text x="600" y="164" font-size="15" fill="#555">misread</text></g>
<g><rect x="740" y="50" width="200" height="140" rx="12" fill="#00A854"/><text x="840" y="82" font-size="14" fill="#ffffff" font-weight="700">STEP 4</text><text x="840" y="116" font-size="18" fill="#ffffff" font-weight="700">Syncs</text><text x="840" y="142" font-size="15" fill="#ffffff">To QuickBooks</text><text x="840" y="164" font-size="15" fill="#ffffff">Online Canada</text></g>
</g>
<g stroke="#007a3d" stroke-width="3" marker-end="url(#a)"><line x1="222" y1="120" x2="256" y2="120"/><line x1="462" y1="120" x2="496" y2="120"/><line x1="702" y1="120" x2="736" y2="120"/></g>
<text x="480" y="236" font-family="Inter,Arial,sans-serif" font-size="14" fill="#555" text-anchor="middle">Offline? Receipts queue on the phone and upload when you reconnect.</text></svg>