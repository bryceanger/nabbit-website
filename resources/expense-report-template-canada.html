<h1>Expense Report Template for Canadian Business (Free Download)</h1>
<p class="lead">A free expense report template designed for Canadian small businesses. Includes columns for GST/HST tracking, CRA-required documentation notes, and a per diem section using CRA's published meal allowance rates.</p>

<p>
<a href="https://docs.google.com/spreadsheets/d/1bNabbitExpenseTemplateCA/copy" class="btn btn-outline">Copy to Google Sheets &rarr;</a>
<a href="https://nabbit.ca/resources/nabbit-expense-report-template.xlsx" class="btn">Download Excel (.xlsx) &rarr;</a>
</p>
<p style="font-size:.88rem;color:var(--muted);margin-top:-8px">To use the template, make a copy of the Google Sheet or download the Excel file and save it as your own template.</p>

<h2>What's in the Template</h2>
<ul>
<li>Employee name and department</li>
<li>Submission date and expense period</li>
<li>Expense line items with: date, vendor, description, category, amount (pre-tax), HST/GST rate, HST/GST amount, total, and receipt attached (yes/no)</li>
<li>Running total of claimable ITCs</li>
<li>Per diem section (meals, incidentals) using CRA rates</li>
<li>Approver signature line</li>
<li>Reimbursement total</li>
</ul>

<h2>Expense Report Fields</h2>
<table>
<tr><th>Field</th><th>Notes</th></tr>
<tr><td>Employee name</td><td>Full legal name</td></tr>
<tr><td>Date</td><td>Date of expense</td></tr>
<tr><td>Vendor</td><td>Business name shown on receipt</td></tr>
<tr><td>Description</td><td>What was purchased and business purpose</td></tr>
<tr><td>Category</td><td>See <a href="/resources/canadian-business-expense-categories">expense categories guide</a></td></tr>
<tr><td>Amount (pre-tax)</td><td>Before HST/GST<\semicolon></td></tr>
<tr><td>HST/GST rate</td><td>5%, 13%, 15%, or applicable PST rate</td></tr>
<tr><td>HST/GST amount</td><td>Tax portion only</td></tr>
<tr><td>Total</td><td>Pre-tax + tax</td></tr>
<tr><td>Receipt attached</td><td>Yes / No — receipts over $30 required for reimbursement</td></tr>
<tr><td>Client / project</td><td>If expense is billable</td></tr>
</table>

<h2>CRA Per Diem Rates (2026)</h2>
<p>For employees travelling on business where meals are not provided by the employer, CRA plishes simplified meal allowance rates:</p>
<table>
<tr><th>Meal</th><th>Rate</th></tr>
<tr><td>Breakfast</td><td>$23</td></tr>
<tr><td>Lunch</td><td>$23</td></tr>
<tr><td>Dinner</td><td>$50</td></tr>
<tr><td><strong>Total per day</strong></td><td><strong>$96</strong></td></tr>
</table>
<p><em>These rates are reviewed annually. For the current published rates, see CRA's Employer's Guide T4130. Actual meal costs can also be claimed with receipts, subject to the 50% meals rule.</em></p>

<h2>When to Use a Template vs. a Receipt Capture Tool</h2>
<p>An expense report template works well for small teams (2–5 people) with occasional expense claims, infrequent travel where a monthly submission is sufficient, and businesses not yet using accounting software.</p>
<p>A receipt capture tool like Nabbit works better when multiple employees are submitting receipts regularly, receipts need to sync directly to QuickBooks, month-end expense reconciliation is taking more than an hour, or you want HST tracked automatically rather than entered manually.</p>
<p>Nabbit does not replace your expense report process — it replaces the need for one. Receipts are captured as they happen, coded automatically, and synced to QuickBooks. No spreadsheet required.</p>
