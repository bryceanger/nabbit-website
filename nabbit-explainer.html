<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nabbit — Receipt capture, simplified</title>
<link rel="canonical" href="https://nabbit.ca/nabbit-explainer">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f1a0f;
  --green:#2EE87A;
  --green-dark:#00C870;
  --green-mid:#1a6636;
  --surface:#F5F0EB;
  --white:#FFFFFF;
  --muted:#6b7566;
  --card:#FFFFFF;
  --border:#DFD9D1;
  --amber:#F59E0B;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}


/* ── NAV ── */
nav{position:sticky;top:0;z-index:100;background:rgba(245,240,235,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:.5rem;text-decoration:none}
.nav-logo img{width:28px;height:28px;border-radius:7px;object-fit:cover}
.nav-logo-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.1rem;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.nav-cta{background:var(--ink);color:#fff;font-size:.825rem;font-weight:600;padding:.5rem 1.125rem;border-radius:6px;text-decoration:none;transition:background .15s}
.nav-cta:hover{background:var(--green-mid)}


/* ── HERO ── */
.hero{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5rem 2rem 4rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(46,232,122,.12) 0%,transparent 70%);pointer-events:none}
