<title>You're all set — Nabbit</title>
<meta name="description" content="Thanks for subscribing to Nabbit."/>
<style>
  :root {
    color-scheme: only light;
    --indigo: #00A854; --indigo-dk: #007A3D; --indigo-lt: #E8F5EE;
    --citrine: #0099CC;
    --slate: #0F1A12; --slate-md: #2D4A35; --slate-lt: #5A7060;
    --white: #F4F8F5; --border: #D6E8DB;
    --font-d: 'Plus Jakarta Sans', sans-serif;
    --font-b: 'Inter', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-b); background: var(--white); color: var(--slate);
    line-height: 1.6; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 2rem;
  }
  .card {
    max-width: 520px; width: 100%; text-align: center;
    background: #fff; border: 1px solid var(--border); border-radius: 24px;
    padding: clamp(2rem, 5vw, 3.5rem) clamp(1.5rem, 5vw, 3rem);
    box-shadow: 0 20px 60px rgba(0,168,84,0.16), 0 4px 16px rgba(15,26,18,0.10);
  }
  .logo { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 1.5rem; display: block; }
  .check {
    width: 64px; height: 64px; border-radius: 50%; background: var(--indigo-lt);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;
  }
  .check svg { width: 32px; height: 32px; }
  h1 {
    font-family: var(--font-d); font-weight: 800; font-size: clamp(1.5rem, 4vw, 2rem);
    letter-spacing: -.03em; margin-bottom: .75rem; color: var(--slate);
  }
  p.lead { color: var(--slate-lt); font-size: 1.05rem; margin-bottom: 2rem; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font-d); font-weight: 700; font-size: .95rem;
    padding: .9rem 2rem; min-height: 48px; border-radius: 100px; border: none;
    background: var(--indigo); color: #fff; width: 100%;
  }
  .btn:hover { background: var(--indigo-dk); }
  .fine { margin-top: 1.5rem; font-size: .85rem; color: var(--slate-lt); }
  .fine a { color: var(--indigo); text-decoration: underline; }
</style>
</head>

<div class="card">
  <img src="logo.jpg" alt="Nabbit" class="logo"/>
  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="#00A854" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
  </div>
  <h1>Thank you!</h1>
  <p class="lead">Your payment went through and your Nabbit account is active. You're ready to go.</p>
  <a href="https://app.nabbit.ca/auth" class="btn">Login and begin</a>
  <p class="fine">Questions about your subscription? <a href="mailto:support@nabbit.ca">Email us</a>.</p>
</div>
